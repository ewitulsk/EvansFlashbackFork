buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://jitpack.io' }
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath("com.gradleup.shadow:com.gradleup.shadow.gradle.plugin:9.3.0")
    }
}

plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'com.gradleup.shadow' version "9.3.0"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        url = uri('deps/maven')
        content {
            includeGroup("com.moulberry")
        }
    }
    maven {
        url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
        content {
            includeGroup("me.djtheredstoner")
        }
    }
    maven {
        url 'https://api.modrinth.com/maven'
        content {
            includeGroup("maven.modrinth")
        }
    }
    maven {
        url = "https://maven.bawnorton.com/releases"
        content {
            includeGroup("com.github.bawnorton.mixinsquared")
        }
    }
    mavenLocal()
}

loom {
    accessWidenerPath = file("src/main/resources/flashback.accesswidener")

    runs {
        client {
            // Scripted hidden-client test harness (see scripts/Test-ClientSmoke.ps1).
            if (providers.gradleProperty('flashbackClientRunDir').isPresent()) {
                runDir providers.gradleProperty('flashbackClientRunDir').get()
            }
            if (providers.gradleProperty('flashbackClientScenario').isPresent()) {
                vmArg '-Dflashback.hiddenClient=true'
                vmArg "-Dflashback.clientScenario=${providers.gradleProperty('flashbackClientScenario').get()}"
            }
            if (providers.gradleProperty('flashbackReplayPath').isPresent()) {
                vmArg "-Dflashback.replayPath=${providers.gradleProperty('flashbackReplayPath').get()}"
            }
        }
    }
}

dependencies {
    // Minecraft and fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Login in dev environment
    runtimeOnly("me.djtheredstoner:DevAuth-fabric:1.1.2")

    // MixinConstraints
    include(implementation("com.moulberry:mixinconstraints:1.0.8"))

    // MixinSquared
    include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.7-beta.1")))

    // Lattice (config) - 26.3 build (SDL input, ported locally)
    include(implementation("com.moulberry:lattice:2.1.0-26.3"))

    // Apache stuff
    include(implementation("org.apache.commons:commons-math3:3.6.1"))
    include(implementation("org.apache.httpcomponents:httpclient:4.5.14"))
    include(implementation("org.apache.httpcomponents:httpcore:4.4.16"))

    // Compat-test runtime jars for the hidden-client compat scenario (loom remaps them).
    // Gitignored under deps/compat-test/ — not part of the shipped artifact.
    if (providers.gradleProperty('flashbackCompatTest').isPresent() && file('deps/compat-test').isDirectory()) {
        localRuntime fileTree('deps/compat-test') { include '*.jar' }
    }

    // Mod compatibility (26.3 builds; bobby has no 26.3 release, its mixins stay dormant)
    compileOnly("maven.modrinth:distanthorizons:I4fvXVOw")
    compileOnly("maven.modrinth:sodium:bAZQdGpg")
    compileOnly("maven.modrinth:iris:bAdKrpw8")
    compileOnly("maven.modrinth:bobby:8gsFUovP")
    compileOnly("maven.modrinth:simple-voice-chat:3fRw6NfP")
    compileOnly("maven.modrinth:modmenu:lcxkZSq6")
    compileOnly("maven.modrinth:scalablelux:g4eqNSKd")

    // FFmpeg
    shadow(implementation("org.bytedeco:javacv-platform:1.5.14") {
        exclude group: "org.bytedeco", module: "artoolkitplus"
        exclude group: "org.bytedeco", module: "artoolkitplus-platform"
        exclude group: "org.bytedeco", module: "flycapture"
        exclude group: "org.bytedeco", module: "flycapture-platform"
        exclude group: "org.bytedeco", module: "leptonica"
        exclude group: "org.bytedeco", module: "leptonica-platform"
        exclude group: "org.bytedeco", module: "libdc1394"
        exclude group: "org.bytedeco", module: "libdc1394-platform"
        exclude group: "org.bytedeco", module: "libfreenect"
        exclude group: "org.bytedeco", module: "libfreenect-platform"
        exclude group: "org.bytedeco", module: "libfreenect2"
        exclude group: "org.bytedeco", module: "libfreenect2-platform"
        exclude group: "org.bytedeco", module: "librealsense2"
        exclude group: "org.bytedeco", module: "librealsense2-platform"
        exclude group: "org.bytedeco", module: "librealsense"
        exclude group: "org.bytedeco", module: "librealsense-platform"
        exclude group: "org.bytedeco", module: "openblas"
        exclude group: "org.bytedeco", module: "openblas-platform"
        exclude group: "org.bytedeco", module: "opencv"
        exclude group: "org.bytedeco", module: "opencv-platform"
        exclude group: "org.bytedeco", module: "tesseract"
        exclude group: "org.bytedeco", module: "tesseract-platform"
        exclude group: "org.bytedeco", module: "videoinput"
        exclude group: "org.bytedeco", module: "videoinput-platform"
        exclude group: "org.bytedeco", module: "ffmpeg"
        exclude group: "org.bytedeco", module: "javacpp"
    })
    // Include bytedeco ffmpeg & natives
    shadow(implementation(group: "org.bytedeco", name: "ffmpeg", version: "8.1.2-1.5.14", classifier: ""))
    shadow(api(rootProject.files('ffmpeg/ffmpeg-natives-linux.jar'))) // Custom natives are from https://github.com/BtbN/FFmpeg-Builds/
    shadow(api(rootProject.files('ffmpeg/ffmpeg-natives-windows.jar')))
    shadow(implementation(group: "org.bytedeco", name: "ffmpeg", version: "8.1.2-1.5.14", classifier: "macosx-x86_64"))
    shadow(implementation(group: "org.bytedeco", name: "ffmpeg", version: "8.1.2-1.5.14", classifier: "macosx-arm64"))
    // Include only platforms we use
    shadow(implementation(group: "org.bytedeco", name: "javacpp", version: "1.5.14", classifier: "linux-x86_64"))
    shadow(implementation(group: "org.bytedeco", name: "javacpp", version: "1.5.14", classifier: "windows-x86_64"))
    shadow(implementation(group: "org.bytedeco", name: "javacpp", version: "1.5.14", classifier: "macosx-x86_64"))
    shadow(implementation(group: "org.bytedeco", name: "javacpp", version: "1.5.14", classifier: "macosx-arm64"))

    // ImGui
    shadow(implementation(rootProject.files('deps/imgui-binding-1.90.0.jar')))
    shadow(api(rootProject.files('deps/imgui-natives.jar')))

    // Native File Dialogs
    String nfdVersion = "org.lwjgl:lwjgl-nfd:3.3.3";

    shadow(implementation(nfdVersion) {
        exclude group: 'org.lwjgl'
        exclude group: 'org.lwjgl.lwjgl'
    })
    shadow(api("org.lwjgl:lwjgl-nfd::natives-macos") {
        exclude group: 'org.lwjgl'
        exclude group: 'org.lwjgl.lwjgl'
    })
    shadow(api("org.lwjgl:lwjgl-nfd::natives-linux") {
        exclude group: 'org.lwjgl'
        exclude group: 'org.lwjgl.lwjgl'
    })
    shadow(api("org.lwjgl:lwjgl-nfd::natives-windows") {
        exclude group: 'org.lwjgl'
        exclude group: 'org.lwjgl.lwjgl'
    })
    shadow(api("org.lwjgl:lwjgl-nfd::natives-macos-arm64") {
        exclude group: 'org.lwjgl'
        exclude group: 'org.lwjgl.lwjgl'
    })
    shadow(api("org.lwjgl:lwjgl-nfd::natives-linux-arm64") {
        exclude group: 'org.lwjgl'
        exclude group: 'org.lwjgl.lwjgl'
    })
    shadow(api("org.lwjgl:lwjgl-nfd::natives-windows-arm64") {
        exclude group: 'org.lwjgl'
        exclude group: 'org.lwjgl.lwjgl'
    })
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    toolchain.languageVersion.set(JavaLanguageVersion.of(25))
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}


shadowJar {
    configurations = [project.configurations.shadow]
    archiveBaseName = "flashback"
    destinationDirectory = file("${buildDir}/tmp/allJar")

    exclude("LICENSE")
    exclude("LICENSE.txt")
}

// Super hacky... merge the shadowJar with the main jar.
// This is needed because the main jar has the includes
// Couldn't find a better way of doing this
tasks.register("mergeShadowWithIncludes", Jar) {
    archiveBaseName.set("merged")
    destinationDirectory = file("${buildDir}/tmp/mergedJar")
    from(zipTree(project.tasks.jar.archiveFile))
    from(zipTree(project.tasks.shadowJar.archiveFile))
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)

    var archiveFileFrom = it.archiveFile
    var archiveFileTo = project.tasks.jar.archiveFile
    doLast {
        // File.renameTo does not overwrite an existing destination on Windows,
        // which silently shipped a jar missing the shaded imgui/ffmpeg classes.
        java.nio.file.Files.move(archiveFileFrom.get().asFile.toPath(), archiveFileTo.get().asFile.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}
project.assemble.dependsOn(mergeShadowWithIncludes)

// Export the configured client launch as a standalone spec for scripted test runners.
// Only project-configured environment additions are exported, never the host's environment.
tasks.register('exportTestLaunches') {
    dependsOn 'classes', 'configureClientLaunch'
    doLast {
        def directory = file(providers.gradleProperty('flashbackLaunchExportDir').get())
        directory.mkdirs()
        def run = tasks.named('runClient').get()
        def javaExecutable = run.javaLauncher.isPresent()
            ? run.javaLauncher.get().executablePath.asFile.absolutePath
            : new File(System.getProperty('java.home'), 'bin/java' + (org.gradle.nativeplatform.platform.internal.DefaultNativePlatform.currentOperatingSystem.isWindows() ? '.exe' : '')).absolutePath
        def command = [javaExecutable]
        // Project-owned scripted processes retain pause evidence beside their normal logs.
        command.add('-Xlog:gc*,safepoint:file=jvm-pauses.log:time,uptime,level,tags:filecount=2,filesize=8M')
        command.addAll(run.allJvmArgs)
        command.addAll(run.jvmArgumentProviders.collectMany { it.asArguments() as List })
        if (!run.classpath.empty) command.addAll(['-cp', run.classpath.asPath])
        command.add(run.mainClass.get())
        if (run.args != null) command.addAll(run.args as List)
        command.addAll(run.argumentProviders.collectMany { it.asArguments() as List })
        // Each exported launch owns its argument files.
        command = command.withIndex().collect { argument, index ->
            if (argument.startsWith('@')) {
                def source = file(argument.substring(1).replaceAll('^"|"$', ''))
                if (!source.isFile()) throw new GradleException('Missing launch argument file: ' + source)
                def snapshot = new File(directory, 'client-arguments-' + index + '.txt')
                snapshot.bytes = source.bytes
                return '@' + snapshot.absolutePath
            }
            return argument
        }
        def runDirectory = providers.gradleProperty('flashbackClientRunDir').map { file(it).absolutePath }.getOrElse(run.workingDir.absolutePath)
        def spec = [command: command, environment: run.environment, directory: runDirectory]
        new File(directory, 'client-launch.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(spec))
    }
}
